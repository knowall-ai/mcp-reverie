name: Release

# Publishes a tagged version: `git tag v0.4.0 && git push origin v0.4.0`.
# - npm: @knowall-ai/reverie with provenance (needs the NPM_TOKEN secret, an npm automation token)
# - GHCR: ghcr.io/knowall-ai/mcp-reverie:<version> and :latest (uses the built-in GITHUB_TOKEN)
# - MCP Registry: ai.knowall/reverie under the knowall.ai domain namespace (DNS-verified: the apex
#   TXT record "v=MCPv1; k=ed25519; p=…" plus the MCP_REGISTRY_PRIVATE_KEY secret); runs after the
#   npm publish because the registry verifies ownership via the published package's mcpName field
# Smithery redeploys from the repository on its own schedule; trigger a redeploy from the
# Smithery dashboard after a release if the listing lags.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"; exit 1
          fi

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/knowall-ai/mcp-reverie
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  registry:
    name: Publish to the MCP Registry
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # kept for npm provenance parity; the registry login is DNS-based
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -sSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: server.json version must match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "$v" != "$tag" ]; then echo "::error::server.json version $v does not match tag v$tag"; exit 1; fi
          done
      - name: Wait for the npm version to be visible
        run: |
          # The registry validates our server.json against npm, and npm needs a
          # moment after publish before the new version resolves. Without this
          # the publish below fails with "version 'x.y.z' was not found (404)"
          # and the job has to be re-run by hand after every release.
          version="${GITHUB_REF_NAME#v}"
          # Bound both the individual request and the loop as a whole: without
          # --max-time a stalled response holds the step open indefinitely, and
          # without a wall-clock deadline the retry count alone guarantees
          # nothing about elapsed time.
          deadline=$(( SECONDS + 300 ))
          attempt=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            code=$(curl -fsS --connect-timeout 10 --max-time 20 \
              -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/@knowall-ai/reverie/$version" || true)
            if [ "$code" = "200" ]; then
              echo "npm serves $version after ${attempt} attempt(s), ${SECONDS}s"
              exit 0
            fi
            echo "attempt $attempt (${SECONDS}s elapsed): npm returned ${code:-no response} for $version; retrying in 10s"
            sleep 10
          done
          echo "::error::npm did not serve @knowall-ai/reverie@$version within 5 minutes"
          exit 1

      - name: Log in to the registry as knowall.ai (DNS namespace)
        run: ./mcp-publisher login dns --domain=knowall.ai --private-key="$MCP_REGISTRY_PRIVATE_KEY"
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
      - run: ./mcp-publisher publish
